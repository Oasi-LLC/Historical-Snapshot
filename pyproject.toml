[project]
name = "historical-snapshot-cli"
version = "0.1.0"
description = "CLI for historical property performance snapshots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]
dashboard = ["streamlit>=1.40.0", "pandas>=2.0.0", "requests>=2.32.0"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
all = ["historical-snapshot-cli[api,dashboard,dev]"]

[project.scripts]
snapshot = "historical_snapshot.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
