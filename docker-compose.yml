services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro
      - ./api:/app/api:ro
    environment:
      PYTHONPATH: /app/src

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8502
    ports:
      - "8502:8502"
    volumes:
      - ./dashboard:/app/dashboard:ro
      - ./data:/app/data:ro
    environment:
      SNAPSHOT_API_URL: http://api:8000
      PYTHONPATH: /app/src
    depends_on:
      - api
